name: server_box
description: server status & toolbox app.
publish_to: "none"
version: 1.0.1816+1816

environment:
  sdk: ">=3.11.0"
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # Reading an OCI image layout and unpacking a rootfs — see
  # `lib/core/utils/oci_image.dart`. Direct because this code imports it: as a
  # transitive one it is whatever some other package happens to want, and a
  # tar reader deciding what a hard link is has already cost this app a
  # release.
  archive: ^4.5.2
  choice: ^2.3.2
  # The time `SessionKeepAlive` measures an idle session against. Read through
  # `clock` rather than `DateTime.now` so a test's fake time moves it too.
  # Already in the tree through flutter_test; named so the import is legal.
  clock: ^1.1.3
  # SHA-256 of a certificate's DER form, for the BMC's pinned certificate.
  # `X509Certificate` only offers sha1 ready made.
  crypto: ^3.0.0
  dio: ^5.11.1
  pinenacl: ^0.6.0
  # ECDSA and RSA key generation for the in-app keygen. Ed25519 comes from
  # pinenacl; dartssh2 does the OpenSSH serialisation for all three. Already
  # here transitively through dartssh2 — named so the import is legal.
  pointycastle: ^4.0.0
  dynamic_color: ^2.1.0
  equatable: ^2.1.0
  easy_isolate: ^1.3.0
  extended_image: ^10.0.0
  file_picker: ^12.3.0
  flutter_gbk2utf8: ^1.0.1
  flutter_riverpod: ^3.3.1
  flutter_highlight: ^0.7.0
  flutter_displaymode: ^0.7.0
  flutter_markdown_plus: ^1.0.12
  flutter_svg: ^2.2.1
  fl_chart: ^1.2.0
  freezed_annotation: ^3.0.0
  get_it: ^9.3.0
  hive_ce: ^2.20.0
  hive_ce_flutter: ^2.3.1
  intl: ^0.20.2
  json_annotation: ^4.9.0
  logging: ^1.3.0
  meta: ^1.18.0
  responsive_framework: ^1.5.1
  riverpod: ^3.2.1
  riverpod_annotation: ^4.0.2
  # Direct, though `SqliteStore` lives in fl_lib: `hooks.user_defines` below is
  # only honoured for this package's own dependencies, and the Hive migration
  # opens the database from here too.
  sqlite3: ^3.6.0
  # Storage layer over the same encrypted connection: `NativeDatabase.opened`
  # takes the `sqlite3` Database this app already opens and keys itself, so
  # sqlite3mc and the build-hook bundling below are untouched.
  drift: ^2.34.4
  wakelock_plus: ^1.8.0
  wake_on_lan: ^4.1.1+3
  webdav_client_plus: ^2.0.0
  # Already here through fl_lib, which does the syncing; named directly only
  # so the crash-report filter can recognise its "not signed in to iCloud"
  # exception by type.
  icloud_storage_plus: ^4.0.0
  url_launcher: ^6.2.6
  dartssh2:
    path: packages/dartssh2
  circle_chart:
    path: packages/circle_chart
  icons_plus:
    git:
      url: https://github.com/lollipopkit/icons_plus
      ref: main
  xterm:
    path: packages/xterm
  computer:
    git:
      url: https://github.com/lollipopkit/dart_computer
      ref: v1.0.88
  watch_connectivity:
    path: packages/watch_connectivity
  plain_notification_token:
    path: packages/plain_notification_token
  fl_lib:
    path: packages/fl_lib
  # The shell on this device: pty, proot on Android, ish-arm64 on iOS. Shared
  # with LLMBox; its native code is built by its own hook.
  fl_tty:
    path: packages/fl_tty
  flutter_rust_bridge: 2.13.0
  # Drives the build hook below. `sbm_ffi` is no longer a Flutter plugin — the
  # hook compiles the crate directly, so there is nothing to depend on.
  flutter_rust_bridge_hooks: 2.13.0
  desktop_drop: ^0.8.4
  sentry: ^9.30.0
  # Runtime for the generated reader in `lib/src/proto`, which is how Android's
  # crash tombstone is decoded. Pure Dart, and its own dependencies —
  # collection, fixnum, meta — are already in this tree.
  protobuf: ^6.1.0
  fixnum: ^1.1.1
  device_info_plus: ^13.2.0
  material_ui: ^1.5.0
  # The LLM layer, shared with GPT Box: pi's agent loop and providers in
  # QuickJS, built by its own hook like `sbm_ffi` (`fl_pi_llm`), and the
  # chats, tools and provider settings over it (`fl_pi_llm_ui`). A submodule
  # like fl_lib.
  fl_pi_llm:
    path: packages/fl_pi_llm/fl_pi_llm
  fl_pi_llm_ui:
    path: packages/fl_pi_llm/fl_pi_llm_ui
  # Imported by the app itself, not only through the packages that bring them
  # in: a transitive dependency can drop or change one under it.
  ffi: ^2.2.0
  path_provider: ^2.1.6
  # HarmonyOS implementations of the plugins whose pub.dev package cannot carry
  # an `ohos` entry: they ship from flutter/packages, which has no such target.
  # Nothing else reads them — an Android, iOS, macOS, Linux or Windows build
  # never names them in its registrant — and on HarmonyOS each one is
  # registered by hand at launch (`lib/core/service/ohos_plugins.dart`), because
  # the plugin it implements does not know to look for it.
  #
  # Versions are the ones that resolve against this tree's platform
  # interfaces: path_provider ^2.1.0, shared_preferences ^2.4.0,
  # url_launcher ^2.3.1.
  path_provider_ohos: ^2.2.1
  shared_preferences_ohos: ^2.2.0
  url_launcher_ohos: ^6.3.0
  path: ^1.9.1
  window_manager: ^0.5.2
  cross_file: ^0.3.5+4
  collection: ^1.19.1
  flutter_local_notifications: ^22.3.1
dependency_overrides:
  # fl_pi_llm_ui asks for fl_lib from git; the submodule is the one.
  fl_lib:
    path: packages/fl_lib
  # For flutter_markdown_plus_latex, in fl_pi_llm_ui: only the root can
  # override it.
  flutter_math_fork: ^0.7.4
  # `code_assets` and `hooks` decide what the native-asset hooks are told about
  # the target. pub.dev's copies predate HarmonyOS: asked for `ohos` they
  # answer `linux`, which is how a Linux `.so` would end up inside a HAP. These
  # are the SDK's own patched copies (the ones `flutter_tools` already builds
  # against), so the hook processes this app spawns read the same schema.
  code_assets:
    git:
      url: https://gitcode.com/CPF-Flutter/fluttertpc_dart_native
      path: pkgs/code_assets
      ref: flutter_3.47.7_deps
  # The framework was split into `material_ui` / `cupertino_ui` packages that
  # live on pub.dev, and those enumerate `TargetPlatform` exhaustively — which
  # the HarmonyOS fork broke by adding a value. The fork's own framework, on the
  # other hand, still carries `src/material` and `src/cupertino` with
  # `TargetPlatform.ohos` handled in all ~200 places. These two shims point the
  # imports back at that copy.
  material_ui:
    path: third_party/material_ui
  cupertino_ui:
    path: third_party/cupertino_ui
  # No OHOS implementation of the camera-based qr_code_dart_scan; this opens
  # Scan Kit's system scan UI and returns the raw value.
  qr_scan_ohos:
    path: third_party/qr_scan_ohos
  # AGC's source-file check flags any .js in the package as source code.
  # These two packages declare Web-only assets (a service worker and a
  # wake-lock script) that HarmonyOS never loads. Local forks keep the
  # plugin API intact but drop those asset declarations so they are not
  # collected into flutter_assets/rawfile.
  wakelock_plus:
    path: third_party/wakelock_plus
  flutter_local_notifications_web:
    path: third_party/flutter_local_notifications_web

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_native_splash: ^2.1.6
  hive_ce_generator: ^1.11.0
  # 2.15 is the floor, not the lockfile's opinion: `--delete-conflicting-outputs`
  # was removed there, and every command this repo documents omits it. On an
  # earlier resolution that flag is live, and without it a conflicting output
  # is a y/n prompt — or a failed build when nothing is there to answer.
  build_runner: ^2.15.0
  drift_dev: ^2.34.0
  # drift_dev 2.34.0 still calls DartPlaceholder.when(), removed by sqlparser
  # 0.44.6. Keep its companion parser at the last compatible release.
  sqlparser: 0.44.5
  flutter_lints: ^6.0.0
  json_serializable: ^6.13.0
  freezed: ^3.0.0
  riverpod_generator: ^4.0.3
  test: ^1.29.0
  # Fake time for unit tests of timers that are not widgets — see
  # `test/unit/remote_desktop/session_keep_alive_test.dart`.
  fake_async: ^1.3.3
  # Theme manifests and SVG icons, read by the tests about this repository's
  # own theme files; the app reads them through fl_lib.
  toml: ^0.18.0
  xml: ^7.0.1
  # The QR encoder, so `server_share_qr_test.dart` can hold the share's
  # capacity cap against what actually gets drawn. fl_lib depends on it too,
  # and `QrView` is the only thing in the app that draws one.
  pretty_qr_code: ^3.3.0
  flutter_test:
    sdk: flutter
  fl_build:
    path: packages/fl_build
  # Imported by tests directly, for the same reason as the block above.
  shared_preferences: ^2.5.5
  vector_graphics_compiler: ^1.3.0
  # The same fork fl_lib takes (flutter_secure_storage#1298).
  # TODO: back to pub.dev once upstream fixes it.
  flutter_secure_storage:
    git:
      url: https://github.com/lollipopkit/flutter_secure_storage.git
      ref: serverbox
      path: flutter_secure_storage
  flutter_secure_storage_platform_interface: ^2.0.1
  # HarmonyOS: the fork's native sides cover android/ios/... but not ohos, so
  # the dart side is the only part that ships there. This package is the
  # OpenHarmony SIG's native port — its pluginClass puts the ArkTS handler on
  # the same method channel (`plugins.it_nomads.com/flutter_secure_storage`)
  # the fork's platform interface already calls, and nothing needs importing:
  # being in the plugin graph is enough for the handler to register.
  flutter_secure_storage_ohos:
    path: /root/work/pkgs/flutter_secure_storage_ohos-1.0.0

# Which SQLite gets compiled into the app. Only the root package can set this —
# a dependency cannot supply its own defaults — so it lives here even though
# every caller is in fl_lib.
#
# `sqlite3mc` rather than `sqlcipher`: both encrypt the whole file, keys and
# indexes included, but SQLCipher links OpenSSL on Windows, Linux and Android,
# where SQLite3MultipleCiphers carries its cipher implementations in its own
# source and needs nothing installed on any of the five platforms.
hooks:
  user_defines:
    sqlite3:
      # Desktop/mobile targets take the prebuilt archive from a GitHub
      # release. OHOS cannot: the toolchain there answers `linux`, and the
      # prebuilt linux library is a glibc build (`libc.so.6`, `GLIBC_2.17`
      # symbols) that the device's musl refuses to relocate — the app died at
      # launch with `fcntl164: symbol not found`. So the `linux` target
      # compiles the SQLite3MultipleCiphers amalgamation from source with the
      # OHOS clang the hook is already given (target `aarch64-linux-ohos`,
      # musl). The amalgamation is vendored under third_party/sqlite3mc —
      # sqlite3mc-2.6.1 on SQLite 3.54.0, fetched through the same proxy.
      source:
        linux: source
        default: sqlite3mc
      path: third_party/sqlite3mc/sqlite3mc_amalgamation.c
      # native_toolchain_c hardcodes `-target aarch64-linux-gnu` for the
      # linux/arm64 pair, which pulls in host glibc headers even through the
      # OHOS clang — the first build came out needing `libc.so.6`/`GLIBC_2.17`
      # again. These flags come last, so they win: real musl target, real
      # OHOS sysroot.
      additional_flags:
        - --target=aarch64-linux-ohos
        - --sysroot=/opt/hmos-sdk/18/openharmony/native/sysroot
        # The OHOS baseline target has no crypto extensions, so arm_neon.h
        # never declares vaeseq_u8/vaesmcq_u8 and the AES-GCM cipher in the
        # amalgamation fails to compile. Every OHOS arm64 device has them.
        - -march=armv8-a+crypto
      additional_libraries:
        - m
      # The prebuilt archives come from a GitHub release, and this sandbox
      # cannot reach github.com. `$RELEASE_TAG` and `$FILENAME` are the hook's
      # own placeholders; the mirror serves the identical file, so the sha256
      # check the hook performs still passes.
      url_pattern: https://gh-proxy.com/https://github.com/simolus3/sqlite3.dart/releases/download/$RELEASE_TAG/$FILENAME

flutter:
  generate: true
  uses-material-design: true
  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/app_icon.png
    # The theme catalog's floor: whose repositories the store offers when its
    # own address does not answer. The list itself is read over HTTPS.
    - assets/catalog/
    # Store themes shipped with the app, installed once on first launch as if
    # from the store — see `ThemePackages.seedBundled`.
    - assets/store_themes/
    # Yet Another Bench Script, vendored verbatim under WTFPL and pinned by
    # `YabsScript.upstreamCommit`. Shipped rather than piped from the network
    # on the server: `curl | bash` fixes no version and verifies nothing, and
    # raw.githubusercontent.com is unreachable from a good share of the hosts
    # people run this against. Refresh with `scripts/update-yabs.sh`.
    #
    # base64, because App Store validation rejects a bundled `.sh` — see
    # `YabsScript.assetPath`. A shell script cannot be added to this list.
    - assets/yabs.b64
    # The Agent's built-in skill, the very files Claude Code reads in this
    # repository — one copy, see `LlmHost.builtinSkills`.
    - .claude/skills/serverbox-help/
    - .claude/skills/serverbox-help/references/
    # The directory, not each file: `Dist.markAsset` names them by enum name.
    # Only distributions whose logo carries an explicit copyright licence are
    # in there — see the README beside them, which Flutter leaves out because
    # it only bundles files it can load.
    - assets/distro/
    # What the globe draws: the coastline outline and nothing else, 20 KB,
    # built by `scripts/build_land_asset.py` from Natural Earth 110m.
    #
    # The 4 MB country database that used to sit beside it is gone. City-level
    # data covers both address families and is downloaded on request, so a
    # bundled coarser copy would have cost every install 4 MB to answer worse.
    - assets/geo/
  shaders:
    # The sphere's shading and its atmosphere. Compiled ahead of time on every
    # platform — Impeller has been the default renderer everywhere since 3.47 —
    # and not required: `GlobePainter` falls back to a radial gradient if the
    # program will not load.
    - assets/shaders/globe.frag
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700

flutter_native_splash:
  color: "#ffffff"
  image: assets/app_icon.png
  color_dark: "#121212"
  info_plist_files:
    - "ios/Runner/Info-Debug.plist"
    - "ios/Runner/Info-Profile.plist"
    - "ios/Runner/Info-Release.plist"
  android12: true

# What `fl_build` names the artifacts it produces, and the `BuildData.name` it
# generates — which is the name the app itself draws. Here rather than in an
# `fl_build.json` of its own, which is a file for one key. CI reads this same
# line, so the name it publishes assets under cannot drift from the name the
# build gave them.
fl_build:
  appName: ShellBuddy
