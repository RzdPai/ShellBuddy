name: file_picker_ohos
description: >-
  Minimal HarmonyOS (OHOS) file picker for ServerBox. Talks to the system
  DocumentViewPicker and copies the picked document into the app cache so the
  caller always receives a plain, dart:io-readable local path.
version: 1.0.0

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.0.0'

dependencies:
  flutter:
    sdk: flutter
  file_picker: '>=12.0.0 <13.0.0'
  cross_file: ^0.3.3

flutter:
  plugin:
    platforms:
      ohos:
        package: com.example.file_picker_ohos
        pluginClass: FilePickerOhosPlugin
